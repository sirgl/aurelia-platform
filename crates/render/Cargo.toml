[package]
name = "aurelia-render"
version = "0.1.0"
edition = "2021"
description = "The wgpu renderer of the Aurelia games: low-poly hex terrain, models, fog of war."
license = "MIT OR Apache-2.0"
authors = ["The Aurelia contributors"]
repository = "https://github.com/sirgl/aurelia-platform"
keywords = ["wgpu", "renderer", "hex", "gamedev"]
categories = ["rendering", "game-development"]
rust-version = "1.98"
publish = false

[lib]
name = "render"

[dependencies]
# std::time::Instant panics in a browser; web-time is std on native.
web-time = "1.1.0"
bytemuck = "1.25.2"
kernel = { package = "aurelia-kernel", path = "../kernel" }
glam = "0.33.11"
pollster = "1.0.1"
rustc-hash = "2.1.3"
spade = "2.15.0"
# Half floats of the feature vertices on the GPU (`GpuFeatureVertex`); already in the tree.
half = { version = "2.7.1", default-features = false }
wgpu = "30.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser backend's handles are not Send; the page runs on one thread (no wasm atomics).
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
# `allocation::try_cast_vec`: the model vertices the page hands over (model_data.rs).
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }

[build-dependencies]
gltf = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sandbox-rules = { package = "aurelia-sandbox-rules", path = "../sandbox-rules" }
sandbox-content = { package = "aurelia-sandbox-content", path = "../sandbox-content" }
# Screenshot harness (examples only): PNG from readback bytes.
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Already in the tree through wgpu-hal: the Metal device's allocated size (GPU memory report).
kernel = { package = "aurelia-kernel", path = "../kernel", features = ["harness"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice"] }
