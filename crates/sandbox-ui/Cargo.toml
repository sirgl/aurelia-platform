[package]
name = "aurelia-sandbox-ui"
version = "0.1.0"
edition = "2021"
description = "The user interface of the sandbox reference module."
license = "MIT OR Apache-2.0"
authors = ["The Aurelia contributors"]
repository = "https://github.com/sirgl/aurelia-platform"
keywords = ["egui", "gamedev", "example"]
categories = ["game-development", "gui"]
rust-version = "1.98"
publish = false

# The sandbox module's user interface: map orders, the top bar, the city
# screen and the end of the turn, plugged into the app shell through
# `client::shell::module::ModuleUi`. Never a classic-* dependency.
[lib]
name = "sandbox_ui"

[dependencies]
client = { package = "aurelia-client", path = "../client" }
i18n = { package = "aurelia-i18n", path = "../i18n" }
kernel = { package = "aurelia-kernel", path = "../kernel" }
render = { package = "aurelia-render", path = "../render" }
sandbox-rules = { package = "aurelia-sandbox-rules", path = "../sandbox-rules" }
sandbox-content = { package = "aurelia-sandbox-content", path = "../sandbox-content" }
egui = "0.36.2"
wgpu = "30.0.1"
