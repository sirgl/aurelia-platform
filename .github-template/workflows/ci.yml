# CI of the platform repository. A TEMPLATE: it lives in platform/.github-template/ and is not run from
# here; at publication move this folder to .github/ (docs/publishing.md in the monorepo; fill the placeholders).
# The platform builds alone: no module, no art pack. NOT RUN YET (written without a runner).
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.98.1
  CARGO_TERM_COLOR: always
  # The repositories of the split sit side by side in the workspace folder (platform/, lands/, ...);
  # the guard scripts take that folder as their root (they cannot use git's top level).
  AURELIA_ROOT: ${{ github.workspace }}

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          path: platform
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libssl-dev libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev \
            mesa-vulkan-drivers
      - uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform/target
          key: platform-${{ runner.os }}-${{ hashFiles('platform/Cargo.lock') }}
          restore-keys: platform-${{ runner.os }}-
      - name: Build (all targets)
        working-directory: platform
        run: cargo +$RUST_TOOLCHAIN check --workspace --all-targets
      - name: Platform lint (the platform names no module)
        run: sh platform/tools/platform-lint.sh
      - name: Localization lint
        run: sh platform/tools/i18n-lint.sh
      - name: Document links
        run: python3 -I platform/tools/check-doc-links.py
      - name: Tests (no GPU)
        working-directory: platform
        run: cargo +$RUST_TOOLCHAIN test --release -p aurelia-i18n -p aurelia-kernel -p aurelia-sandbox-rules -p aurelia-sandbox-content -p aurelia-net
